#!/usr/sbin/nft -f
# Firewall di local:os: blocca tutto ciò che entra, tranne le risposte
# a connessioni avviate dal computer stesso.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    # Necessari per IPv6 e diagnostica di rete
    meta l4proto ipv6-icmp accept
    meta l4proto icmp icmp type { echo-reply, destination-unreachable, time-exceeded } accept
    # DHCP (risposte del router)
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
