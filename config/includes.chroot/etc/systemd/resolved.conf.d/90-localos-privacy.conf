# DNS cifrato (DNS-over-TLS) verso Quad9, che blocca anche domini malevoli.
# Se una rete pubblica (hotel, treno) con pagina di accesso non funziona,
# cambiare temporaneamente DNSOverTLS in "opportunistic".
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net
FallbackDNS=
DNSOverTLS=yes
DNSSEC=allow-downgrade
LLMNR=no
MulticastDNS=no
