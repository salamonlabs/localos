# Privacy di rete di local:os
[main]
dns=systemd-resolved

[connectivity]
# Niente controlli periodici verso server esterni per verificare la connessione
enabled=false

[device]
# MAC casuale durante la ricerca delle reti Wi-Fi
wifi.scan-rand-mac-address=yes

[connection]
# MAC diverso per ogni rete, stabile sulla stessa rete (evita il tracciamento tra reti)
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
# Indirizzi IPv6 temporanei
ipv6.ip6-privacy=2
# Non comunicare il nome del computer al router
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
