# Irrobustimento del kernel di local:os (impatto sulle prestazioni trascurabile)

# Nasconde gli indirizzi interni del kernel e i suoi messaggi agli utenti normali
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Un programma non può ispezionare la memoria di un altro, salvo i propri figli
kernel.yama.ptrace_scope = 1

# Riduce le superfici d'attacco
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
kernel.kexec_load_disabled = 1

# Niente core dump di programmi privilegiati (possono contenere dati in memoria)
fs.suid_dumpable = 0
fs.protected_fifos = 2
fs.protected_regular = 2

# Rete: ignora reindirizzamenti e instradamenti imposti da altri
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# I timestamp TCP rivelano da quanto tempo il computer è acceso
net.ipv4.tcp_timestamps = 0

# Nota: i namespace utente restano attivi di proposito, servono alla sandbox di Firefox
